name: KMP CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ---------------------------------------------------------
  # جاب 1: اینڈرائیڈ اور شیئرڈ ماڈیول کی بلڈنگ (Linux)
  # ---------------------------------------------------------
  build-android:
    name: Build Android & Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Run Shared Module Tests (JVM)
        run: ./gradlew :shared:jvmTest --no-daemon

  # ---------------------------------------------------------
  # جاب 2: آئی او ایس ایپ کی بلڈنگ (macOS)
  # ---------------------------------------------------------
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Kotlin/Native Framework for iOS
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon

      - name: Build iOS App (Simulator)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            clean build
