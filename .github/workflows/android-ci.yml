name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest # Linux رنر جو اینڈرائیڈ بلڈنگ کے لیے تیز اور مفت ہے

    steps:
      # 1. کوڈ کو ریپوزٹری سے حاصل کریں
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. JDK 17 سیٹ اپ کریں (آپ کے پروجیکٹ کی ضرورت)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. گرڈل کیشنگ کو فعال کریں تاکہ بلڈنگ تیز ہو
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 4. گرڈل ریپر (Wrapper) کو ایگزیک्यूٹ ایبل بنائیں
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. اینڈرائیڈ ڈیبگ APK بلڈ کریں
      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      # 6. بلڈ شدہ APK فائل کو GitHub Actions میں محفوظ کریں
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-App-Debug-APK
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7 # فائل 7 دن تک محفوظ رہے گی
